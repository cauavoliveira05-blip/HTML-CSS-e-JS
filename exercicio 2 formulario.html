<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form> 
       <div>
        <p>Dados pessoais:</p>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digte seu nome completo"><br><br>
        <label for="Codigo">Codigo:</label>
        <input type="number" id="Codigo" name="Codigo" placeholder="Digite o Codigo"><br><br>
        </div>
         <div>
        <p>Genero:</p> 
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label><br>
         </div>
        <div>
        <p> Endereço:</p>    
        <label for="rua">Rua:</label>
        <input type="text" id="rua" name="rua" placeholder="Digite sua Rua"><br><br>
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro" placeholder="Digite seu Bairro"><br><br>
        <label for="numero">Numero:</label>
        <input type="number" id="numero" name="numero" placeholder="Digite o seu Numero"><br><br>
        <label for="municipio">Municipio:</label>
        <input type="text" id="municipio" name="municipio" placeholder="Digite seu Municipio"><br><br>
        
       <td  class="label"><label for="estado">Estado:</label></td>
         <td class="input"><select id="estado" name="estado">
          <option value="">Selecione</option>
          <option value="AC">Acre</option>
          <option value="AL">Alagoas</option>
          <option value="AP">Amapá</option>
          <option value="AM">Amazonas</option>
          <option value="BA">Bahia</option>
          <option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option>
          <option value="ES">Espírito Santo</option>
          <option value="GO">Goiás</option>
          <option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option>
          <option value="MS">Mato Grosso do Sul</option>
          <option value="MG">Minas Gerais</option>
          <option value="PA">Pará</option>
          <option value="PB">Paraíba</option>
          <option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option>
          <option value="PI">Piauí</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RN">Rio Grande do Norte</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="RO">Rondônia</option>
          <option value="RR">Roraima</option>
          <option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option>
          <option value="SE">Sergipe</option>
          <option value="TO">Tocantins</option>
        </select></td><br><br>
       </div>
        
         <button type="submit">Enviar</button>
         <button type="reset">Limpar</button>

</form>
</body>
</html>
