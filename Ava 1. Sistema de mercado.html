
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Mercado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: #247346;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
        }

        input, select {
            border: 1px solid #ccc;
            background-color: white;
        }

        button {
            border: none;
            cursor: pointer;
            margin-top: 15px;
            background-color: #247346;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .remover {
            width: auto;
            margin-top: 0;
            padding: 7px 10px;
            background-color: #c0392b;
            font-size: 13px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .item-info {
            overflow-wrap: anywhere;
        }

        .total {
            margin-top: 20px;
            padding: 15px;
            background-color: #e7f5eb;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #247346;
            text-align: center;
        }

        #resultado {
            margin-top: 20px;
            line-height: 1.6;
        }

        .vazio {
            color: #777;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sistema de Mercado</h1>

        <form id="formItem" autocomplete="off">

            <label for="nomeItem">Nome do item:</label>

            <input
                type="text"
                id="nomeItem"
                list="listaProdutos"
                placeholder="Digite ou selecione um produto"
                required
            >

            <datalist id="listaProdutos">
                <!-- As opções serão criadas pelo JavaScript -->
            </datalist>

            <label for="quantidadeItem">Quantidade:</label>

            <input
                type="number"
                id="quantidadeItem"
                min="1"
                step="1"
                value="1"
                required
            >

            <label for="valorUnitario">Valor unitário (R$):</label>

            <input
                type="number"
                id="valorUnitario"
                min="0"
                step="0.01"
                placeholder="Digite ou selecione um produto"
                required
            >

            <button type="submit">Adicionar item</button>

        </form>

        <h2>Itens da compra</h2>

        <div id="itens-lista">
            <p class="vazio">Nenhum item adicionado.</p>
        </div>

        <div class="total">
            Total: <span id="totalCompra">R$ 0,00</span>
        </div>

        <label for="formaPagamento">Forma de pagamento:</label>

        <select id="formaPagamento">
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="PIX">PIX</option>
            <option value="Dinheiro">Dinheiro</option>
        </select>

        <button type="button" id="finalizarCompra">
            Finalizar compra
        </button>

        <div id="resultado" aria-live="polite"></div>

    </div>

        // 2. ELEMENTOS DO HTML

        const nomeItem = document.getElementById("nomeItem");
        const quantidadeItem = document.getElementById("quantidadeItem");
        const valorUnitario = document.getElementById("valorUnitario");
        const listaProdutos = document.getElementById("listaProdutos");
        const itensLista = document.getElementById("itens-lista");
        const totalCompra = document.getElementById("totalCompra");
        const formaPagamento = document.getElementById("formaPagamento");
        const resultado = document.getElementById("resultado");
        const formItem = document.getElementById("formItem");

        // Guarda os itens adicionados à compra.
        const itens = [];

        const moeda = valor => valor.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });


        // 3. CRIA A LISTA DE PRODUTOS

        function carregarProdutos() {
            produtos.forEach(produto => {
                const opcao = document.createElement("option");

                opcao.value = produto.nome;
                listaProdutos.appendChild(opcao);
            });
        }


        // 4. PREENCHE O PREÇO AO SELECIONAR UM PRODUTO

        nomeItem.addEventListener("input", function () {
            const nomeDigitado = nomeItem.value.trim().toLowerCase();

            const produto = produtos.find(p =>
                p.nome.toLowerCase() === nomeDigitado
            );

            if (produto) {
                valorUnitario.value = produto.preco.toFixed(2);
            } else {
                valorUnitario.value = "";
            }
        });


        // 5. ADICIONA UM ITEM À COMPRA

        formItem.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const nome = nomeItem.value.trim();
            const quantidade = Number(quantidadeItem.value);
            const preco = Number(valorUnitario.value);

            if (
                !nome ||
                !Number.isInteger(quantidade) ||
                quantidade < 1 ||
                valorUnitario.value === "" ||
                !Number.isFinite(preco) ||
                preco < 0
            ) {
                alert("Confira o nome, a quantidade e o preço.");
                return;
            }

            itens.push({
                nome: nome,
                quantidade: quantidade,
                preco: preco
            });

            atualizarLista();

            formItem.reset();
            quantidadeItem.value = 1;
            nomeItem.focus();

            resultado.innerHTML = "";
        });


        // 6. MOSTRA OS ITENS E CALCULA O TOTAL

        function atualizarLista() {
            itensLista.innerHTML = "";

            if (itens.length === 0) {
                itensLista.innerHTML =
                    '<p class="vazio">Nenhum item adicionado.</p>';
            }

            itens.forEach((item, indice) => {
                const subtotal = item.quantidade * item.preco;

                const linha = document.createElement("div");
                linha.className = "item";

                const informacao = document.createElement("div");
                informacao.className = "item-info";

                const nome = document.createElement("strong");
                nome.textContent = item.nome;

                const detalhe = document.createElement("div");
                detalhe.textContent =
                    `${item.quantidade} x ${moeda(item.preco)} = ${moeda(subtotal)}`;

                informacao.append(nome, detalhe);

                const botao = document.createElement("button");
                botao.type = "button";
                botao.className = "remover";
                botao.textContent = "Remover";
                botao.setAttribute(
                    "aria-label",
                    `Remover ${item.nome}`
                );

                botao.addEventListener("click", function () {
                    itens.splice(indice, 1);
                    atualizarLista();
                    resultado.innerHTML = "";
                });

                linha.append(informacao, botao);
                itensLista.appendChild(linha);
            });

            const total = itens.reduce(
                (soma, item) => soma + item.quantidade * item.preco,
                0
            );

            totalCompra.textContent = moeda(total);
        }


        // 7. FINALIZA A COMPRA

        document.getElementById("finalizarCompra")
            .addEventListener("click", function () {

                if (itens.length === 0) {
                    alert("Adicione pelo menos um item antes de finalizar.");
                    return;
                }

                const total = itens.reduce(
                    (soma, item) => soma + item.quantidade * item.preco,
                    0
                );

                const pagamento = formaPagamento.value;

                resultado.replaceChildren();

                const titulo = document.createElement("h2");
                titulo.textContent = "Compra finalizada!";

                const totalTexto = document.createElement("p");
                totalTexto.textContent = "Total pago: " + moeda(total);

                const pagamentoTexto = document.createElement("p");
                pagamentoTexto.textContent =
                    "Forma de pagamento: " + pagamento;

                resultado.append(
                    titulo,
                    totalTexto,
                    pagamentoTexto
                );
            });


        // INICIA O SISTEMA

        carregarProdutos();
        atualizarLista();

    </script>
