<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Mercado</title>
</head>
<body>
    <div class="container">
        <h2>Sistema de Mercado</h2>
        <form id="formItem" autocomplete="off" onsubmit="adicionarItem();return false;">
            <label for="nomeItem">Nome do Item:</label>
            <input type="text" id="nomeItem" placeholder="Digite o nome do item" required>
            <label for="quantidadeItem">Quantidade:</label>
            <input type="number" id="quantidadeItem" min="1" value="1" required>
            <label for="valorUnitario">Valor Unitário (R$):</label>
            <input type="number" id="valorUnitario" min="0" step="0.01" placeholder="Digite o valor unitário" required>
            <button type="submit">Adicionar Item</button>
        </form>
        <div id="itens-lista"></div>
        <label for="formaPagamento">Forma de Pagamento:</label>
        <select id="formaPagamento">
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="cartao">Cartão de Crédito</option>
             <option value="pix">PIX</option>
        </select>
        <button onclick="finalizarCompra()">Finalizar Compra</button>
        <div id="resultado"></div>
    </div>
